[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-agent-bench"
version = "0.19.0"
description = "Agent-facing CLI for profiling and benchmarking local LM Studio nodes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Scott Joyner"}]
dependencies = [
  "requests>=2.31.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "jsonschema>=4.21.0",
  "build>=1.2.0",
]
graph = [
  "neo4j>=5.0",
  "sentence-transformers>=2.2.0",
]

[project.scripts]
# Never install a command named `lms`: that name belongs to LM Studio's official
# CLI and is required for Link-aware `lms ps --json --host ...` observation.
lms-agent = "lms_agent_bench.cli:main"
lms-bench = "lms_agent_bench.lms_cli_v2:main"
lmsbench = "lms_agent_bench.lms_cli_v2:main"
lms-bench-endpoints = "lms_agent_bench.lms_endpoint_registry:main"
lmstudio-bridge = "lms_agent_bench.lmstudio_cli_bridge:main"
lms-fleet = "lms_agent_bench.fleet_loadout:main"

[tool.setuptools]
packages = ["lms_agent_bench"]

[tool.setuptools.package-data]
"lms_agent_bench" = ["benchmarks/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
