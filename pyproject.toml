[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-agent-bench"
version = "0.8.0"
description = "Agent-facing CLI for profiling and benchmarking local LM Studio nodes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Scott Joyner"}]
dependencies = [
  "requests>=2.31.0"
]

[project.scripts]
lms = "lms_cli_v2:main"

[tool.setuptools]
py-modules = [
  "lms_cli_v2",
  "lms_cli",
  "lms_skill_export",
  "lms_run_audit",
  "lms_manifest_validate",
  "lms_agent_brief",
  "lms_model_fit",
  "lms",
  "lms_machine_profile",
  "lms_eval",
  "benchmark_lmstudio_cross_machine_models",
  "benchmark_lmstudio_inventory"
]

[tool.setuptools.package-data]
"*" = ["benchmarks/*.json", "schemas/*.json"]
