[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-agent-bench"
version = "0.13.0"
description = "Agent-facing CLI for profiling and benchmarking local LM Studio nodes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Scott Joyner"}]
dependencies = [
  "requests>=2.31.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "jsonschema>=4.21.0",
  "build>=1.2.0"
]

[project.scripts]
lms-bench = "lms_cli_v2:main"
lmsbench = "lms_cli_v2:main"
lms-bench-endpoints = "lms_endpoint_registry:main"
lmstudio-bridge = "lmstudio_cli_bridge:main"

[tool.setuptools]
py-modules = [
  "lms_cli_v2",
  "lms_cli",
  "lms_config",
  "lms_endpoint_registry",
  "lmstudio_cli_bridge",
  "lms_skill_export",
  "lms_run_audit",
  "lms_manifest_validate",
  "lms_artifact_validate",
  "lms_agent_brief",
  "lms_model_fit",
  "lms",
  "lms_machine_profile",
  "lms_eval",
  "benchmark_lmstudio_cross_machine_models",
  "benchmark_lmstudio_inventory"
]

[tool.setuptools.package-data]
"*" = ["benchmarks/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
