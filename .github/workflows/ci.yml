name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e ".[test]"
          pip install "setuptools>=68" wheel

      - name: Ruff lint
        run: ruff check src tests

      - name: pytest
        run: pytest -q
        env:
          # No live Neo4j in CI; graph-sync smoke tests mock the driver.
          NEO4J_PASSWORD: ""

      # This job's Python 3.12 result is one of the five pinned required
      # GitHub check contexts. The separate EXP-053 governance workflow uses
      # a path filter and is NOT itself required by the candidate ruleset.
      - name: EXP-053 offline governance gate (when present in checkout)
        if: matrix.python-version == '3.12'
        run: |
          if [ -d governance/exp053 ]; then
            test -f governance/exp053/exp053_admin_activation.py
            python -m unittest discover -s governance/exp053 -p 'test_exp053_*.py' -q
            python governance/exp053/EXP053_validate_ruleset_candidate_2026-10-20.py --dry-run
            python governance/exp053/exp053_admin_activation.py
          else
            echo 'EXP-053 governance not present in this pre-adoption checkout'
          fi

      - name: Build distributable wheel and source archive
        run: python -m build --no-isolation --wheel --sdist --outdir dist

      - name: Offline built-wheel CLI smoke
        run: python scripts/offline_wheel_smoke.py
        env:
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          # The test launches packaged --help entrypoints only.
          # Never route to real inference services in packaging CI.
          NEO4J_PASSWORD: ""
