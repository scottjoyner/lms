name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e ".[test]"
          pip install "setuptools>=68" wheel

      - name: Ruff lint
        run: ruff check src tests

      - name: pytest
        run: pytest -q
        env:
          # No live Neo4j in CI; graph-sync smoke tests mock the driver.
          NEO4J_PASSWORD: ""

      - name: Build distributable wheel and source archive
        run: python -m build --no-isolation --wheel --sdist --outdir dist

      - name: Offline built-wheel CLI smoke
        run: python scripts/offline_wheel_smoke.py
        env:
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          # The test launches packaged --help entrypoints only.
          # Never route to real inference services in packaging CI.
          NEO4J_PASSWORD: ""
