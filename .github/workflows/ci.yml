name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e ".[test]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Hosted test scope (research-only exclusions)
        run: |
          echo "Hosted CI runs core + EXP053 no-source software tests."
          echo "test_k2_* contains CPU/GPU/tokenizer/model-corpus integration suites"
          echo "requiring torch, transformers, and independently pinned LOCAL artifacts."
          echo "Those tests are NOT reported as hosted CI passing; run them in the"
          echo "isolated, source-authoritative research environment instead."
          find tests -maxdepth 1 -name 'test_k2_*.py' | sort

      - name: Hosted core and EXP053 tests (no private corpus)
        run: pytest -q --ignore-glob='tests/test_k2_*.py'
        env:
          # No live Neo4j or research model weights in hosted CI.
          NEO4J_PASSWORD: ""
