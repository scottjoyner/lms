name: fleet-operational-reliability-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  operational-failure-injection:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile operational modules
        run: |
          python -m py_compile \
            src/lms_agent_bench/fleet_operational_hardening.py \
            src/lms_agent_bench/fleet_transfer_hardening.py \
            src/lms_agent_bench/fleet_rollout_complete.py \
            src/lms_agent_bench/fleet_operator.py \
            src/lms_agent_bench/fleet_operator_entrypoint.py \
            src/lms_agent_bench/fleet_evidence_attestation.py \
            src/lms_agent_bench/hermes_agent_secure_entrypoint.py \
            src/lms_agent_bench/loadout_qualification_operator.py \
            src/lms_agent_bench/loadout_qualification_secure_entrypoint.py \
            src/lms_agent_bench/loadout_qualification_attestation.py
      - name: Run operational and failure-injection tests
        run: |
          python -m pytest -q \
            tests/test_fleet_operator.py \
            tests/test_fleet_operator_entrypoint.py \
            tests/test_fleet_operational_hardening.py \
            tests/test_fleet_transfer_hardening.py \
            tests/test_fleet_evidence_attestation.py \
            tests/test_hermes_agent_secure_entrypoint.py \
            tests/test_loadout_qualification_operator.py \
            tests/test_loadout_qualification_attestation.py \
            tests/test_fleet_failure_safety.py \
            tests/test_fleet_rollout_command.py \
            tests/test_fleet_gate.py
      - name: Smoke-test hardened commands
        run: |
          lms-fleet-rollout --help >/dev/null
          lms-fleet-rollout validate --help >/dev/null
          lms-fleet-operator --help >/dev/null
          lms-fleet-operator preflight --help >/dev/null
          lms-fleet-operator observe --help >/dev/null
          lms-fleet-operator verify --help >/dev/null
          lms-fleet-attest --help >/dev/null
          lms-fleet-attest sign --help >/dev/null
          lms-fleet-attest verify --help >/dev/null
          lms-hermes-bench --help >/dev/null
          lms-hermes-bench run --help >/dev/null
          lms-loadout-qualification-run --help >/dev/null
          lms-loadout-qualification-run run --help >/dev/null
          lms-loadout-qualification-run verify --help >/dev/null
          lms-loadout-qualification-attest --help >/dev/null
          lms-loadout-qualification-attest sign --help >/dev/null
          lms-loadout-qualification-attest verify --help >/dev/null
