name: loadout-qualification-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualification-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile qualification module
        run: python -m py_compile src/lms_agent_bench/loadout_qualification.py
      - name: Run qualification tests
        run: python -m pytest -q tests/test_loadout_qualification.py
      - name: Smoke-test qualification command
        run: |
          lms-loadout-qualify --help >/dev/null
          lms-loadout-qualify bind-throughput --help >/dev/null
          lms-loadout-qualify qualify --help >/dev/null
          lms-loadout-qualify verify --help >/dev/null
